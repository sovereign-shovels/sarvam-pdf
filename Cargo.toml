[package]
name = "sarvam-pdf"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Shovels <github.com/sovereign-shovels>"]
license = "Apache-2.0"
description = "Drag a PDF, get it in your language. 22 Indic languages."
repository = "https://github.com/sovereign-shovels/sarvam-pdf"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
lopdf = "0.34"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
